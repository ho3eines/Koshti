name: Build Android APK

# Builds a debug + release APK and publishes them as downloadable artifacts.
# Runs on every push, and can be triggered manually from the Actions tab.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Koshti Debug,O=Koshti,C=US"

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Sign release APK with the debug key
        continue-on-error: true
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          for apk in android/app/build/outputs/apk/release/*-unsigned.apk; do
            [ -f "$apk" ] || continue
            signed="${apk%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$signed.tmp"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/app/debug.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "$signed" "$signed.tmp"
            rm -f "$signed.tmp"
          done

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find android/app/build/outputs -name "*.apk" -exec cp {} artifacts/ \;
          echo "--- Built APKs ---"
          ls -lh artifacts/

      - name: Publish APK into public/ and deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          npm run build:public
          mkdir -p public/apk
          cp artifacts/*.apk public/apk/ 2>/dev/null || true
          ls -lh public/apk/ || true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koshti-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      # Tagging a release (e.g. `git tag v1.0.0 && git push --tags`) also
      # attaches the APKs to a GitHub Release for easy public download.
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
